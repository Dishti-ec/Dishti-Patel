   <rect x="-18" y="-128" width="62" height="46" rx="6" fill="#1B4332" stroke="#D8F3DC" stroke-width="3"/><rect x="-10" y="-120" width="46" height="30" rx="3" fill="#D8F3DC"/><path d="M-4,-96 l12,-10 l10,6 l16,-12" stroke="#2D6A4F" stroke-width="3" fill="none"/>
   <g id="hR"><circle cy="-285" r="96" fill="#C68E64" stroke="#1B4332" stroke-width="4"/>
    <path d="M-98,-270 Q-104,-395 0,-388 Q104,-395 98,-270 Q92,-330 40,-345 Q-40,-325 -98,-270Z" fill="#1F1410" stroke="#1B4332" stroke-width="3"/><circle cx="62" cy="-376" r="30" fill="#1F1410" stroke="#1B4332" stroke-width="3"/>
    <g id="eR"><ellipse cx="-34" cy="-278" rx="11" ry="15" fill="#1A2E1A"/><ellipse cx="34" cy="-278" rx="11" ry="15" fill="#1A2E1A"/></g>
    <path d="M-28,-236 Q0,-214 28,-236" stroke="#1A2E1A" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="0" cy="-262" r="6" fill="#E76F51"/>
    <circle cx="-60" cy="-248" r="12" fill="#E07A5F" opacity=".5"/><circle cx="60" cy="-248" r="12" fill="#E07A5F" opacity=".5"/></g>

  <g id="ui" opacity="0" transform="translate(600,330)"><rect width="300" height="300" rx="26" fill="#F8FAF6" stroke="#1B4332" stroke-width="5"/><rect width="300" height="56" rx="26" fill="#2D6A4F"/><rect y="30" width="300" height="26" fill="#2D6A4F"/><use href="#leaf" transform="translate(30,28) rotate(-30) scale(.9)" fill="#D8F3DC"/>
   <g stroke="#1B4332" stroke-width="3"><circle cx="60" cy="110" r="26" fill="#D8F3DC"/><circle cx="60" cy="180" r="26" fill="#D8F3DC"/><circle cx="60" cy="250" r="26" fill="#D8F3DC"/></g>
   <path d="M60,128 q-14,-20 0,-34 q14,14 0,34z" fill="#2D6A4F"/><path d="M60,196 v-26 M60,176 l-12,-12 M60,170 l12,-12" stroke="#2D6A4F" stroke-width="5" fill="none"/><path d="M48,246 l9,9 l16,-18" stroke="#2D6A4F" stroke-width="6" fill="none"/>
   <g fill="#B7E4C7"><rect x="108" y="98" width="150" height="22" rx="11"/><rect x="108" y="168" width="150" height="22" rx="11"/><rect x="108" y="238" width="150" height="22" rx="11"/></g></g>
  <g id="cert" opacity="0" transform="translate(700,250)"><rect x="-70" y="-45" width="140" height="95" rx="10" fill="#F8FAF6" stroke="#1B4332" stroke-width="4"/><use href="#leaf" transform="translate(-22,10) rotate(-35) scale(1.1)" fill="#52B788" stroke="#1B4332" stroke-width="2"/><path d="M-50,-22 h100 M-50,-8 h70" stroke="#95D5B2" stroke-width="6"/><circle cx="46" cy="30" r="14" fill="#E9C46A" stroke="#1B4332" stroke-width="3"/></g>
  <!-- dashboard -->
  <g id="dash" opacity="0" transform="translate(1440,360)"><rect width="310" height="250" rx="22" fill="#F8FAF6" stroke="#1B4332" stroke-width="5"/>
   <g fill="#B7E4C7" stroke="#1B4332" stroke-width="2"><rect x="24" y="30" width="130" height="24" rx="8"/><rect x="24" y="66" width="130" height="24" rx="8"/><rect x="24" y="102" width="130" height="24" rx="8"/></g>
   <circle cx="262" cy="52" r="20" fill="#52B788" stroke="#1B4332" stroke-width="3"/><path d="M252,52 l7,8 l13,-16" stroke="#F8FAF6" stroke-width="5" fill="none"/>

   <path d="M24,200 L70,170 L110,185 L150,140" stroke="#2D6A4F" stroke-width="5" fill="none"/>

  <g id="tokG" opacity="0"><circle r="70" fill="url(#glow)"/><circle r="34" fill="#52B788" stroke="#1B4332" stroke-width="5"/><circle r="25" fill="none" stroke="#D8F3DC" stroke-width="3"/><use href="#leaf" transform="translate(-14,10) rotate(-40) scale(.8)" fill="#F8FAF6"/></g>
  <g id="icons" opacity="0"></g>
  <g id="title" opacity="0" text-anchor="middle"><text x="960" y="215" font-size="104" font-weight="800" fill="#1B4332" letter-spacing="10" stroke="#F8FAF6" stroke-width="10" paint-order="stroke">CARBONBRIDGE</text>
   <text x="960" y="285" font-size="38" font-weight="600" fill="#2D6A4F" letter-spacing="9" stroke="#F8FAF6" stroke-width="8" paint-order="stroke">BRIDGING ECOLOGY &amp; ECONOMY</text></g>
 </g>
</g>
</svg>
<script>
const $=id=>document.getElementById(id),NSv='http://www.w3.org/2000/svg';
const cl=x=>Math.max(0,Math.min(1,x)),ez=x=>x*x*(3-2*x),sg=(t,a,b)=>ez(cl((t-a)/(b-a)));
const el=(p,tag,at)=>{const e=document.createElementNS(NSv,tag);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e};
const kf=(t,k)=>{for(let i=1;i<k.length;i++)if(t<=k[i][0]){const a=k[i-1],b=k[i];return a[1]+(b[1]-a[1])*ez(cl((t-a[0])/(b[0]-a[0])))}return k[k.length-1][1]};
// static decor
const rows=$('rows');for(let i=-9;i<=9;i++)el(rows,'line',{x1:960+i*36,y1:800,x2:960+i*190,y2:1080});
for(let i=0;i<40;i++){const x=(i*163)%1920,y=830+(i*71)%230;el(rows,'path',{d:`M${x},${y} q6,-22 12,0 q6,-22 12,0`,fill:'none'})}
const tr=$('trees');[[120,720],[300,700],[1180,705],[1820,710],[1480,690]].forEach(([x,y])=>{el(tr,'rect',{x:x-8,y:y-70,width:16,height:80,fill:'#6B4226'});el(tr,'circle',{cx:x,cy:y-90,r:52,fill:'#52B788',stroke:'#1B4332','stroke-width':4})});
[[40,30],[55,70],[30,85],[75,40],[85,52],[45,100],[20,55]].forEach(([x,y])=>el($('mk'),'circle',{cx:x,cy:y,r:3.5}));
// bridge leaves
const P0=[660,700],C=[975,330],P1=[1290,700],bz=u=>[(1-u)**2*P0[0]+2*u*(1-u)*C[0]+u*u*P1[0],(1-u)**2*P0[1]+2*u*(1-u)*C[1]+u*u*P1[1]];
const tg=u=>{const dx=2*(1-u)*(C[0]-P0[0])+2*u*(P1[0]-C[0]),dy=2*(1-u)*(C[1]-P0[1])+2*u*(P1[1]-C[1]);return[dx,dy]};
const L1=[],L2=[],N=24,lv=$('leaves');
for(let i=0;i<=N;i++){const u=i/N,[x,y]=bz(u),[dx,dy]=tg(u),a=Math.atan2(dy,dx)*180/Math.PI,s=i%2?-1:1;
 L1.push([u,el(lv,'use',{href:'#leaf',fill:i%2?'#52B788':'#95D5B2',stroke:'#1B4332','stroke-width':2.5,opacity:0}),x,y,a+s*55]);
 L2.push([u,el(lv,'use',{href:'#leaf',fill:i%2?'#2D6A4F':'#74C69D',stroke:'#1B4332','stroke-width':2.5,opacity:0}),x,y,a-s*70])}
// icons
const ic=$('icons'),IC=[[250,400,0],[640,410,1],[1280,410,2],[1670,400,3],[960,430,4]];
IC.forEach(([x,y,k])=>{const g=el(ic,'g',{'data-x':x,'data-y':y});el(g,'circle',{r:42,fill:'#F8FAF6',stroke:'#1B4332','stroke-width':4});
 if(k==0)el(g,'path',{d:'M0,-6 a12,12 0 1 0 .1,0z M-20,30 q20,-34 40,0z',fill:'#2D6A4F'});
 if(k==1){el(g,'path',{d:'M0,22 V0 M0,6 l-12,-12 M0,0 l12,-12',stroke:'#2D6A4F','stroke-width':5,fill:'none'});el(g,'circle',{cy:-18,r:14,fill:'#52B788'})}
 if(k==2){el(g,'circle',{r:22,fill:'#52B788',stroke:'#1B4332','stroke-width':3});el(g,'use',{href:'#leaf',transform:'translate(-12,8) rotate(-40) scale(.7)',fill:'#F8FAF6'})}
 if(k==3){el(g,'rect',{x:-18,y:-20,width:36,height:40,fill:'#2D6A4F'});el(g,'path',{d:'M-10,-10h6M4,-10h6M-10,2h6M4,2h6',stroke:'#F8FAF6','stroke-width':4})}
 if(k==4)el(g,'use',{href:'#leaf',transform:'translate(-18,10) rotate(-40) scale(1.1)',fill:'#52B788',stroke:'#1B4332','stroke-width':2})});
const D=8,FPS=12,t0=performance.now();let last=-1;
function draw(t){
 const sc=cl((t-7.6)/.4),out=1-ez(sc);
 // camera
 const z=1+.16*sg(t,0,2)-.16*sg(t,2,3.5);
 $('cam').setAttribute('transform',`translate(${(1-z)*620},${(1-z)*760}) scale(${z})`);
 // sapling
 const gp=sg(t,.3,1.4),so=out;$('sap').setAttribute('opacity',gp>0?so:0);
 $('sapg').setAttribute('transform',`scale(${gp*(1+.04*Math.sin(t*6))}) `);
 $('lglow').setAttribute('opacity',(sg(t,1.4,1.7)*(.7+.3*Math.sin(t*9)))*(1-sg(t,2.2,2.8))*1);
 // farmer arm
 const plant=t<2?-45+14*Math.sin(t*12)*sg(t,.3,.5)*(1-sg(t,1.4,1.6)):0;
 const ang=t<2?(plant*(1-sg(t,1.6,2))):kf(t,[[2,0],[2.5,-135],[5.2,-135],[5.7,-20],[6.5,-20],[7.6,-20],[8,0]]);
 const aw=t<2?kf(t,[[0,0],[.3,-45],[1.5,-45],[2,0]])+14*Math.sin(t*12)*(t>.3&&t<1.5?1:0):ang;
 $('armF').setAttribute('transform',`translate(58,-170) rotate(${t<2?aw:ang+(t>6.5&&t<7.6?-25*Math.sin((t-6.5)*8):0)})`);
 $('phone').setAttribute('opacity',sg(t,2,2.4)*(1-sg(t,5.2,5.7)));
 // blink & bob
 const f=Math.floor(t*FPS),bF=f%22==9,bR=f%22==16;
 $('eF').setAttribute('transform',`translate(0,-278) scale(1,${bF?.1:1}) translate(0,278)`);
 $('eR').setAttribute('transform',`translate(0,-278) scale(1,${bR?.1:1}) translate(0,278)`);
 $('hF').setAttribute('transform',`translate(0,${2.5*Math.sin(t*4.7)}) rotate(${2*Math.sin(t*3.1)} 0 -200)`);
 $('hR').setAttribute('transform',`translate(0,${2.5*Math.sin(t*4.7+1)}) rotate(${-2*Math.sin(t*3.1)} 0 -200)`);
 $('farmer').setAttribute('transform',`translate(520,${830+(t>6.5&&t<7.6?-3*Math.abs(Math.sin(t*6)):0)})`);
 // scene 2 ui
 const uo=sg(t,2.2,2.6)*(1-sg(t,3.6,4.1));$('ui').setAttribute('opacity',uo);
 $('ui').setAttribute('transform',`translate(600,${330+30*(1-sg(t,2.2,2.6))})`);
 $('field').setAttribute('opacity',sg(t,2.3,2.5)*(1-sg(t,3.8,4.3)));$('field').setAttribute('stroke-dashoffset',1-sg(t,2.3,3.3));
 $('pin').setAttribute('opacity',sg(t,3,3.3)*(1-sg(t,3.8,4.3)));
 $('cert').setAttribute('opacity',sg(t,3,3.4)*(1-sg(t,3.9,4.4)));
 $('cert').setAttribute('transform',`translate(700,${250-8*Math.sin(t*5)})`);
 // bridge & token
 const bp=sg(t,3.5,5);$('bridge').setAttribute('stroke-dashoffset',1-bp);
 $('bridge').setAttribute('opacity',out);
 $('bridgeGlow').setAttribute('opacity',(.45*sg(t,5,6.5)+.2*bp)*out);
 const thick=sg(t,6.5,7.2);
 [L1,L2].forEach((L,k)=>L.forEach(([u,e,x,y,a])=>{const v=k==0?sg(bp,u-.02,u+.04)*out:Math.min(sg(t,6.4,7.3),1)*out*(u<=1?1:0)*(sg(thick,u*.7,u*.7+.3));
  e.setAttribute('opacity',v);const s=(k==0?1:.8)*(1+.5*thick)*(1+.07*Math.sin(t*7+u*9));
  e.setAttribute('transform',`translate(${x},${y}) rotate(${a+3*Math.sin(t*5+u*7)}) scale(${s})`)}));
 const tp=sg(t,3.8,5.3),[tx,ty]=bz(tp);
 $('tokG').setAttribute('opacity',sg(t,3.5,3.9)*(1-sg(t,5.3,5.8)));
 $('tokG').setAttribute('transform',`translate(${t<3.8?700-40*(1-sg(t,3.5,3.8))*0+0:tx},${t<3.8?(700-sg(t,3.5,3.8)*0):ty-20}) scale(${.8+.25*Math.sin(t*10)*.5+.4*sg(t,3.5,3.8)})`);
 // rep
 const ro=sg(t,4.7,5.4)*out;$('rep').setAttribute('opacity',ro);
 $('repi').setAttribute('transform',`translate(${1400+60*(1-sg(t,4.7,5.4))},${830+(t>6.5&&t<7.6?-3*Math.abs(Math.sin(t*6+1)):0)})`);
 $('armR').setAttribute('transform',`translate(-54,-170) rotate(${t>6.7&&t<7.7?60+40*Math.sin(t*9):0})`);
 $('dash').setAttribute('opacity',sg(t,5,5.6)*(1-sg(t,6.6,7.1)));
 $('dash').setAttribute('transform',`translate(1440,${360+20*(1-sg(t,5,5.6))})`);
 // map
 $('map').setAttribute('opacity',.7*sg(t,5,5.5)*(1-sg(t,6.5,6.9)));
 // finale
 $('hill5').setAttribute('opacity',sg(t,6.5,7.2)*out);
 $('title').setAttribute('opacity',sg(t,6.9,7.4)*out);
 $('icons').setAttribute('opacity',sg(t,6.6,7.2)*out);
 [...$('icons').children].forEach((g,i)=>g.setAttribute('transform',`translate(${g.dataset.x},${+g.dataset.y+8*Math.sin(t*3+i*1.7)}) scale(${.7+.3*sg(t,6.6+i*.08,7.1+i*.08)})`));
 $('sun').setAttribute('r',64+3*Math.sin(t*3));
}
function loop(now){const t=((now-t0)/1000)%D,f=Math.floor(t*FPS);
 if(f!==last){last=f;$('turb').setAttribute('seed',1+f%3);draw(f/FPS)}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
