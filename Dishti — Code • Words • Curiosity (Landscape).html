{const g=N.getContext('2d');for(let i=0;i<2200;i++){g.fillStyle=`rgba(255,255,255,${h(i)*.5})`;g.fillRect(h(i+7)*256,h(i+9)*256,1+h(i+3)*2,1)}}

const IT=[
{k:'code',a:-2.8,rx:740,ry:250,s:2.0,c:CY},{k:'code',a:-2.3,rx:600,ry:270,s:2.25,c:SB},

const KF=[[0,0,0],[.5,-1,.3],[1.2,-1,.3],[1.9,0,0],[2.2,-1,.2],[3.4,-1,.2],[3.8,.7,.6],[4.9,.7,.6],[5.2,.8,-.6],[6.3,.8,-.6],[6.7,0,0],[8,0,0]];

function hands(){

function arm(s,e,side){ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.quadraticCurveTo((s[0]+e[0])/2+side*40,(s[1]+e[1])/2+30,e[0],e[1]);

function head(gx,gy,dl,blink,bob,sw){

    ctx.beginPath();ctx.moveTo(1050,752);ctx.lineTo(1300,752);ctx.lineTo(1345,816);ctx.lineTo(1005,816);ctx.closePath();fs('#f2e8cf');

    for(let i=0;i<5;i++){const len=(i<3?.55+.15*h(i):pr*.7)*210,y=768+i*11;ctx.beginPath();ctx.moveTo(1048-i*8,y);

      ctx.fillStyle='#f3e6bf';ctx.fillRect(b[0]+b[2]-14,b[1]+6,10,b[3]-12)});

    const SL=[892,650],SR=[1028,650],L=hd[0],R=hd[1];
    arm(SL,L,-1);arm(SR,R,1);
    ctx.beginPath();ctx.moveTo(R[0],R[1]);ctx.lineTo(R[0]+38,R[1]-78);ctx.lineCap='round';ctx.lineWidth=14;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=8;ctx.strokeStyle='#e8d46a';ctx.stroke();

function idea(){
  const g1=ss(5,5.5,T)*(1-ss(6.4,6.9,T)),g2=ss(5.7,6.2,T)*(1-ss(6.4,6.9,T));

      ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();

      else{ctx.moveTo(-16,12);ctx.lineTo(-16,-2);ctx.moveTo(-4,12);ctx.lineTo(-4,-10);ctx.moveTo(8,12);ctx.lineTo(8,4);ctx.moveTo(18,12);ctx.lineTo(18,-14)}

}

function draw(){

  [2,3.5,5,6.5].forEach(b=>{const p=(T-b)/.35;if(p>0&&p<1){const x=mx(-400,2400,p);ctx.fillStyle='rgba(165,216,255,.13)';

}
