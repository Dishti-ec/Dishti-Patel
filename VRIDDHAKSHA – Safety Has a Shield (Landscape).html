<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),lr=(a,b,e)=>a+(b-a)*e;
const eob=x=>1+2.9*Math.pow(x-1,3)+1.9*Math.pow(x-1,2),ec=x=>1-Math.pow(1-x,3);
const bn=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const bp=(a,b,n)=>{let s='';for(let i=0;i<n*2;i++){const g=i*Math.PI/n,r=i%2?a:b*(i%6==0?1.12:1);s+=(Math.cos(g)*r).toFixed(0)+','+(Math.sin(g)*r).toFixed(0)+' '}return s};
// chips
$('#chips').innerHTML=['OTP REQUEST','BANK IMPERSONATION','URGENCY TRICK','VOICE PHISHING'].map((l,i)=>{const y=370+i*95,a=(2.55+i*.22),h=a+.1;return `<g data-t="${a.toFixed(2)},3.5" data-k="pop" data-o="1285,${y}"><rect class="o" x="1070" y="${y-36}" width="430" height="72" rx="36" fill="#fff" stroke="#D62828"/><circle cx="1110" cy="${y}" r="20" fill="#D62828"/><text class="cm" style="stroke:none;fill:#fff" x="1110" y="${y+11}" font-size="32">!</text><text class="ui" x="1145" y="${y+9}" font-size="25" fill="#8E1B1B">${l}</text></g><g data-t="${a.toFixed(2)},${h.toFixed(2)}" data-k="pop" data-o="1070,${y}"><g transform="translate(1070 ${y})"><polygon data-b="38,90,9" fill="#FFB703" class="o"/></g></g>`}).join('');
// family / police icons
const ic=(x,y,c,a)=>`<g data-t="${a},6.35" data-k="pop" data-o="${x},${y}"><circle class="o" cx="${x}" cy="${y}" r="62" fill="${c}"/><circle cx="${x}" cy="${y-14}" r="18" fill="#fff"/><path d="M${x-30},${y+38} Q${x},${y-8} ${x+30},${y+38}Z" fill="#fff"/></g>`;
$('#fam').innerHTML=ic(1500,380,'#2E8B57',5.75)+ic(1500,560,'#2E8B57',5.9)+`<g data-t="6.05,6.35" data-k="pop" data-o="1500,740"><g transform="translate(1500 740) scale(.42)"><use href="#sh" class="o" fill="#0B3D91" stroke-width="14"/><path d="M0,-70 L20,-20 L74,-20 L30,12 L46,66 L0,34 L-46,66 L-30,12 L-74,-20 L-20,-20Z" fill="#FFB703"/></g></g>`;
// small shields
$('#smalls').innerHTML=[[560,340],[1370,360],[520,650],[1410,670],[1300,900]].map((p,i)=>`<g data-t="${(6.95+i*.1).toFixed(2)},7.95" data-k="pop" data-o="${p[0]},${p[1]}"><g class="bob" data-y="${p[1]}"><g transform="translate(${p[0]} ${p[1]}) scale(.5)"><use href="#sh" class="o" fill="#2E8B57" stroke-width="12"/><path d="M-50,10 L-12,50 L55,-40" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>`).join('');
$$('[data-b]').forEach(e=>{const[a,b,n]=e.dataset.b.split(',').map(Number);e.setAttribute('points',bp(a,b,n))});
let r='';for(let i=0;i<36;i++){const a=i*Math.PI/18,P=(R,d)=>(960+R*Math.cos(a+d)).toFixed(0)+','+(540+R*Math.sin(a+d)).toFixed(0);r+=`<polygon points="${P(420,-.01)} ${P(1700,-.05)} ${P(1700,.05)} ${P(420,.01)}"/>`}
$('#rays').innerHTML=r;
// caches
const A=$$('[data-t]').map(e=>{const[a,b]=e.dataset.t.split(',').map(Number),o=(e.dataset.o||'960,540').split(',').map(Number);return{e,a,b,k:e.dataset.k,o}});
const V=$$('[data-v]').map(e=>({e,r:e.dataset.v.split(';').map(s=>s.split(',').map(Number))}));
const D=$$('[data-d]').map(e=>({e,a:+e.dataset.d.split(',')[0],b:+e.dataset.d.split(',')[1]}));
D.forEach(d=>{d.e.setAttribute('stroke-dasharray','1 1')});
const net=$('#net'),dots=[...$('#dots').children],bobs=$$('.bob');
const T=(e,s)=>e.setAttribute('transform',s);
function R(t,f){
 $('#tb').setAttribute('seed',f%24+1);
 for(const x of A){const q=pr(t,x.b,x.b+.2),p=pr(t,x.a,x.a+.3),vis=t>=x.a&&t<x.b+.2;x.e.style.display=vis?'':'none';if(!vis)continue;
  let sx=1,sy=1,o=1-q;
  if(x.k=='pop'){const s=eob(p),w=.25*(1-p)*Math.sin(p*10);sx=s*(1+w);sy=s*(1-w)}else o=p*(1-q);
  T(x.e,`translate(${x.o[0]} ${x.o[1]}) scale(${sx} ${sy}) translate(${-x.o[0]} ${-x.o[1]})`);x.e.setAttribute('opacity',o)}
 for(const v of V)v.e.style.display=v.r.some(r=>t>=r[0]&&t<r[1])?'':'none';
 for(const d of D)d.e.setAttribute('stroke-dashoffset',1-pr(t,d.a,d.b));
 T($('#cam'),`translate(960 540) scale(${1+.03*t/8}) translate(-960 -540)`);
 T($('#rays'),`rotate(${(f%4)*1.4} 960 540)`);
 $('#sc').setAttribute('opacity',pr(t,0,.25)*(1-pr(t,7.75,8)));
 const ro=t<5.8?1-pr(t,5,5.25):pr(t,6.2,6.45);
 $('#chars').setAttribute('opacity',ro);$('#room').setAttribute('opacity',Math.max(ro,0));
 $('#crimf').setAttribute('opacity',t<4?1:1-pr(t,4,5));
 // man
 const e=ec(pr(t,6.2,6.6)),mx=lr(640,800,e),my=lr(430,470,e),ms=lr(1.1,1.05,e);
 T($('#man'),`translate(${mx} ${my}) scale(${ms})`);
 let dx=0,rot=0;if(t>.3&&t<2.2){dx=f%2?3:-3;rot=f%2?2:-2}
 T($('#mph'),`translate(${dx} 0) rotate(${rot} 245 135)`);
 // daughter
 let px,py=470;if(t<5.6)px=lr(1980,1500,ec(pr(t,3.6,4.1)));else px=1130;
 T($('#dau'),`translate(${px} ${py}) scale(1.05)`);
 // rings & beam
 [['#rA',0],['#rB',.5]].forEach(([s,o])=>{const ph=((t-.4)*1.5+o)%1;$(s).setAttribute('r',50+90*ph);$(s).setAttribute('opacity',1-ph)});
